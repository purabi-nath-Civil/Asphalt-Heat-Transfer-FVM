name: Run Simulation
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy matplotlib
      - run: python project.py
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.png