name: Run Simulation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas matplotlib

      - name: Run simulation
        run: python project.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.zip